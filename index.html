<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020617">

<title>SmartTap PH | Digital Card</title>

<style>

/* ================================
   RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: #ffffff;

    background:
        radial-gradient(
            circle at top left,
            rgba(37, 99, 235, 0.45),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(14, 165, 233, 0.30),
            transparent 35%
        ),
        #020617;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 24px 14px;
}


/* ================================
   MAIN CARD
================================ */

.card {
    width: 100%;
    max-width: 430px;

    background: rgba(15, 23, 42, 0.96);

    border: 1px solid rgba(255, 255, 255, 0.10);

    border-radius: 30px;

    padding: 30px 20px 24px;

    text-align: center;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45);

    backdrop-filter: blur(20px);

    animation: fadeIn 0.6s ease;
}


/* ================================
   ANIMATION
================================ */

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* ================================
   SMARTTAP LOGO
================================ */

.logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 18px;

    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #0284c7
        );

    display: flex;
    justify-content: center;
    align-items: center;

    box-shadow:
        0 10px 30px rgba(37, 99, 235, 0.30);
}

.logo svg {
    width: 43px;
    height: 43px;
}


/* ================================
   CUSTOMER INFORMATION
================================ */

.name {
    font-size: 28px;
    font-weight: 800;

    letter-spacing: -0.5px;

    margin-bottom: 6px;
}

.username {
    color: #93c5fd;

    font-size: 15px;

    margin-bottom: 11px;
}

.bio {
    color: #cbd5e1;

    font-size: 14px;

    line-height: 1.6;

    max-width: 330px;

    margin: 0 auto 24px;
}


/* ================================
   CALL BUTTON
================================ */

.call-button {
    width: 100%;
    min-height: 56px;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 10px;

    margin-bottom: 17px;

    padding: 14px;

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #0284c7
        );

    color: #ffffff;

    text-decoration: none;

    font-size: 16px;

    font-weight: 700;

    box-shadow:
        0 10px 25px rgba(37, 99, 235, 0.30);

    transition: 0.25s ease;
}

.call-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 15px 30px rgba(37, 99, 235, 0.40);
}

.call-icon {
    width: 22px;
    height: 22px;

    fill: none;

    stroke: currentColor;

    stroke-width: 2;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* ================================
   SOCIAL LINKS
================================ */

.social-links {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.social-link {
    width: 100%;
    min-height: 58px;

    display: flex;
    align-items: center;

    gap: 15px;

    padding: 11px 16px;

    border-radius: 17px;

    background:
        rgba(255, 255, 255, 0.07);

    border:
        1px solid rgba(255, 255, 255, 0.08);

    color: #ffffff;

    text-decoration: none;

    transition: 0.25s ease;
}

.social-link:hover {
    transform: translateY(-2px);

    background:
        rgba(255, 255, 255, 0.12);
}


/* ================================
   SOCIAL ICONS
================================ */

.social-icon {
    width: 36px;
    height: 36px;

    flex-shrink: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 10px;
}

.social-icon svg {
    width: 22px;
    height: 22px;
}

.facebook-icon {
    background: #1877F2;
}

.instagram-icon {
    background:
        linear-gradient(
            135deg,
            #833AB4,
            #FD1D1D,
            #FCAF45
        );
}

.tiktok-icon {
    background: #000000;

    border:
        1px solid rgba(255, 255, 255, 0.20);
}


/* ================================
   SOCIAL TEXT
================================ */

.social-text {
    display: flex;

    flex-direction: column;

    align-items: flex-start;

    gap: 2px;
}

.social-title {
    font-size: 15px;
    font-weight: 700;
}

.social-handle {
    font-size: 12px;
    color: #94a3b8;
}


/* ================================
   SMARTTAP PROMOTION
================================ */

.smarttap-promo {
    margin-top: 25px;

    padding: 20px 16px;

    border-radius: 20px;

    background:
        linear-gradient(
            135deg,
            rgba(37, 99, 235, 0.18),
            rgba(14, 165, 233, 0.10)
        );

    border:
        1px solid rgba(59, 130, 246, 0.25);
}

.promo-title {
    font-size: 17px;
    font-weight: 800;

    margin-bottom: 7px;
}

.promo-text {
    color: #cbd5e1;

    font-size: 13px;

    line-height: 1.5;

    margin-bottom: 15px;
}


/* ================================
   GET SMARTTAP BUTTON
================================ */

.get-smarttap {
    width: 100%;
    min-height: 48px;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 12px;

    border-radius: 13px;

    background: #ffffff;

    color: #0f172a;

    text-decoration: none;

    font-size: 14px;

    font-weight: 800;

    transition: 0.25s ease;
}

.get-smarttap:hover {
    transform: translateY(-2px);

    background: #f8fafc;
}


/* ================================
   FOOTER
================================ */

.footer {
    margin-top: 22px;

    padding-top: 20px;

    border-top:
        1px solid rgba(255, 255, 255, 0.08);
}

.brand {
    font-size: 15px;

    font-weight: 800;

    margin-bottom: 5px;
}

.tagline {
    font-size: 11px;

    color: #94a3b8;

    letter-spacing: 1.2px;
}


/* ================================
   MOBILE
================================ */

@media (max-width: 400px) {

    .card {
        padding: 27px 16px 22px;

        border-radius: 25px;
    }

    .logo {
        width: 64px;
        height: 64px;
    }

    .name {
        font-size: 25px;
    }

}

</style>

</head>


<body>


<div class="card">


    <!-- ================================
         SMARTTAP PH LOGO
    ================================= -->

    <div class="logo">

        <svg
            viewBox="0 0 64 64"
            fill="none"
            xmlns="http://www.w3.org/2000/svg">

            <path
                d="M12 32C12 21 21 12 32 12"
                stroke="white"
                stroke-width="5"
                stroke-linecap="round"
            />

            <path
                d="M20 32C20 25.4 25.4 20 32 20"
                stroke="white"
                stroke-width="5"
                stroke-linecap="round"
            />

            <circle
                cx="32"
                cy="32"
                r="5"
                fill="white"
            />

        </svg>

    </div>


    <!-- ================================
         CUSTOMER NAME
    ================================= -->

    <h1
        id="profileName"
        class="name">
        Customer Name
    </h1>


    <!-- ================================
         USERNAME
    ================================= -->

    <div
        id="profileUsername"
        class="username">
        @username
    </div>


    <!-- ================================
         BIO
    ================================= -->

    <p
        id="profileBio"
        class="bio">
        Business Owner
    </p>


    <!-- ================================
         CALL BUTTON

         IMPORTANT:
         The JavaScript below puts the
         customer's phone number into
         this button as a tel: link.
    ================================= -->

    <a
        id="callButton"
        class="call-button"
        href="tel:+639171234567">

        <svg
            class="call-icon"
            viewBox="0 0 24 24"
            aria-hidden="true">

            <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2
                19.79 19.79 0 0 1-8.63-3.07
                19.5 19.5 0 0 1-6-6
                19.79 19.79 0 0 1-3.07-8.67
                A2 2 0 0 1 4.11 2h3
                a2 2 0 0 1 2 1.72
                12.84 12.84 0 0 0 .7 2.81
                2 2 0 0 1-.45 2.11L8.09 9.91
                a16 16 0 0 0 6 6l1.27-1.27
                a2 2 0 0 1 2.11-.45
                12.84 12.84 0 0 0 2.81.7
                A2 2 0 0 1 22 16.92z">
            </path>

        </svg>

        Call Me

    </a>


    <!-- ================================
         SOCIAL MEDIA
    ================================= -->

    <div class="social-links">


        <!-- FACEBOOK -->

        <a
            id="facebookLink"
            class="social-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer">

            <span
                class="social-icon facebook-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true">

                    <path
                        fill="white"
                        d="M14 8h3V4h-3c-3.31 0-5 1.69-5 5v3H6v4h3v8h4v-8h3.5l.5-4H13V9c0-.67.33-1 1-1z">
                    </path>

                </svg>

            </span>

            <span class="social-text">

                <span class="social-title">
                    Facebook
                </span>

                <span
                    id="facebookHandle"
                    class="social-handle">
                    Facebook Profile
                </span>

            </span>

        </a>


        <!-- INSTAGRAM -->

        <a
            id="instagramLink"
            class="social-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer">

            <span
                class="social-icon instagram-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true">

                    <rect
                        x="3"
                        y="3"
                        width="18"
                        height="18"
                        rx="5"
                        fill="none"
                        stroke="white"
                        stroke-width="2">
                    </rect>

                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                        fill="none"
                        stroke="white"
                        stroke-width="2">
                    </circle>

                    <circle
                        cx="17.5"
                        cy="6.5"
                        r="1.2"
                        fill="white">
                    </circle>

                </svg>

            </span>

            <span class="social-text">

                <span class="social-title">
                    Instagram
                </span>

                <span
                    id="instagramHandle"
                    class="social-handle">
                    @username
                </span>

            </span>

        </a>


        <!-- TIKTOK -->

        <a
            id="tiktokLink"
            class="social-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer">

            <span
                class="social-icon tiktok-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true">

                    <path
                        fill="#25F4EE"
                        d="M15.5 3c.3 2.1 1.5 3.5 3.5 3.7v3.1
                        c-1.4-.1-2.6-.5-3.5-1.2v6.6
                        c0 3.5-2.7 5.8-6.2 5.8
                        C6.1 21 4 18.9 4 16.1
                        c0-2.9 2.3-5.3 5.3-5.3
                        .5 0 1 .1 1.4.2v3.2
                        c-.4-.1-.8-.2-1.2-.2
                        -1.2 0-2.2.9-2.2 2.1
                        0 1.2.9 2.1 2.2 2.1
                        1.5 0 2.9-1 2.9-3.2V3h3.1z">
                    </path>

                    <path
                        fill="#FE2C55"
                        d="M16.1 3c.4 1.4 1.3 2.4 2.9 2.9v2.9
                        c-1.4-.1-2.6-.5-3.5-1.2v6.6
                        c0 3.5-2.7 5.8-6.2 5.8
                        -1.1 0-2.1-.3-2.9-.8
                        .6.3 1.2.5 1.9.5
                        1.5 0 2.9-1 2.9-3.2V3h4.9z"
                        opacity="0.85">
                    </path>

                </svg>

            </span>

            <span class="social-text">

                <span class="social-title">
                    TikTok
                </span>

                <span
                    id="tiktokHandle"
                    class="social-handle">
                    @username
                </span>

            </span>

        </a>


    </div>


    <!-- ================================
         SMARTTAP PH PROMOTION
    ================================= -->

    <div class="smarttap-promo">

        <div class="promo-title">
            Want Your Own SmartTap Card?
        </div>

        <div class="promo-text">
            Make sharing your social media and
            online presence easier with SmartTap PH.
        </div>

        <a
            class="get-smarttap"
            href="https://jethrojade.github.io/smarttapph/"
            target="_blank"
            rel="noopener noreferrer">

            Get Your SmartTap Card

        </a>

    </div>


    <!-- ================================
         FOOTER
    ================================= -->

    <div class="footer">

        <div class="brand">
            SmartTap PH
        </div>

        <div class="tagline">
            TAP. CONNECT. GROW.
        </div>

    </div>


</div>


<script>

/* =====================================================
   CUSTOMER INFORMATION
=====================================================

   CHANGE ONLY THE VALUES BELOW.

   PHONE NUMBER:
   Use international format.

   Example:
   +639171234567

===================================================== */

const PROFILE = {

    name: "Jethro Jade Duerme",
  

    bio: "Business Owner | Entrepreneur",

    phone: "+639154622606",

    facebook:
        "https://www.facebook.com/share/19UobkVDFB/",

    facebookName:
        "Jethro Jade Duerme",

    instagram:
        "https://www.instagram.com/itssmeee.jeth?stkn=MWlqYXFwNWtmOWNncA==",

    instagramName:
        "@itsssmee.jeth",

    tiktok:
        "https://www.tiktok.com/@jeth.67?_r=1&_t=ZS-99rVPkEecvE",

    tiktokName:
        "@Jethro.67"

};


/* =====================================================
   CUSTOMER NAME
===================================================== */

document.getElementById("profileName").textContent =
    PROFILE.name;


/* =====================================================
   USERNAME
===================================================== */

document.getElementById("profileUsername").textContent =
    PROFILE.username;


/* =====================================================
   BIO
===================================================== */

document.getElementById("profileBio").textContent =
    PROFILE.bio;


/* =====================================================
   PHONE CALL
=====================================================

   This creates:

   tel:+639171234567

   When the visitor taps "Call Me",
   their phone handles the telephone link.

===================================================== */

document.getElementById("callButton").href =
    "tel:" + PROFILE.phone;


/* =====================================================
   FACEBOOK
===================================================== */

document.getElementById("facebookLink").href =
    PROFILE.facebook;

document.getElementById("facebookHandle").textContent =
    PROFILE.facebookName;


/* =====================================================
   INSTAGRAM
===================================================== */

document.getElementById("instagramLink").href =
    PROFILE.instagram;

document.getElementById("instagramHandle").textContent =
    PROFILE.instagramName;


/* =====================================================
   TIKTOK
===================================================== */

document.getElementById("tiktokLink").href =
    PROFILE.tiktok;

document.getElementById("tiktokHandle").textContent =
    PROFILE.tiktokName;

</script>


</body>

</html>
